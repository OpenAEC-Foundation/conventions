name: Auto-assign issues (Reusable)

on:
  workflow_call:
    inputs:
      assignees:
        description: JSON array of GitHub usernames to assign
        required: true
        type: string
      issue_number:
        description: Issue or pull request number; defaults to the triggering item
        required: false
        type: number
        default: ${{ github.event.issue.number || github.event.pull_request.number || 0 }}

jobs:
  assign:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assign the issue or pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ASSIGNEES: ${{ inputs.assignees }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            if (!Number.isSafeInteger(issueNumber) || issueNumber <= 0) {
              throw new Error('issue_number must be a positive integer');
            }
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              assignees: JSON.parse(process.env.ASSIGNEES)
            });
