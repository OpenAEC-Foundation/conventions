name: Auto-assign issues (Reusable)

on:
  workflow_call:
    inputs:
      assignees:
        description: JSON array of GitHub usernames to assign
        required: true
        type: string

jobs:
  assign:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assign the issue or pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ASSIGNEES: ${{ inputs.assignees }}
        with:
          script: |
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: JSON.parse(process.env.ASSIGNEES)
            });
